name: VRGL Basketball Analysis Pipeline

on:
  # Run daily at 5 AM Central Time (11 AM UTC during CST, 10 AM UTC during CDT)
  # Using 11 AM UTC to cover CST - adjust if needed for CDT
  schedule:
    - cron: '0 11 * * *'
  
  # Allow manual triggering
  workflow_dispatch:

# Set permissions for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-vrgl-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper git operations
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgdal-dev \
            libudunits2-dev \
            libproj-dev \
            libgeos-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev
      
      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-v3-${{ hashFiles('.github/workflows/vrgl-pipeline.yml') }}
          restore-keys: |
            ${{ runner.os }}-r-v3-
      
      - name: Install R dependencies
        run: |
          Rscript -e '
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          options(timeout = 600)
          
          # Install packages one by one to see which fails
          packages <- c("tidyverse", "hoopR", "wehoop", "glue", "sp", "fastDummies", 
                       "splitTools", "dials", "xgboost", "MLmetrics", 
                       "glmnet", "gsubfn", "jsonlite", "odds.converter", 
                       "lubridate", "data.table", "here", "gt", "gtExtras")
          
          for (pkg in packages) {
            cat("\n=== Installing", pkg, "===\n")
            tryCatch({
              if (!requireNamespace(pkg, quietly = TRUE)) {
                install.packages(pkg, dependencies = TRUE, Ncpus = 2)
              }
              library(pkg, character.only = TRUE)
              cat("✓", pkg, "installed and loaded successfully\n")
            }, error = function(e) {
              cat("✗ Error installing", pkg, ":", conditionMessage(e), "\n")
              stop(paste("Failed to install", pkg))
            })
          }
          
          cat("\n=== All packages installed successfully ===\n")
          '
      
      - name: Verify R environment
        run: |
          Rscript -e '
          cat("=== R Environment Info ===\n")
          cat("R version:", R.version.string, "\n")
          cat("Library paths:", .libPaths(), "\n\n")
          cat("=== Checking for tidyverse ===\n")
          if (require(tidyverse, quietly = TRUE)) {
            cat("✓ tidyverse loaded successfully\n")
            cat("tidyverse version:", as.character(packageVersion("tidyverse")), "\n")
          } else {
            cat("✗ tidyverse failed to load\n")
            stop("tidyverse not available")
          }
          cat("\n=== Checking for hoopR ===\n")
          if (require(hoopR, quietly = TRUE)) {
            cat("✓ hoopR loaded successfully\n")
          } else {
            cat("✗ hoopR failed to load\n")
            stop("hoopR not available")
          }
          '
      
      - name: Verify directory structure
        run: |
          echo "Current directory:"
          pwd
          echo "Directory contents:"
          ls -la
          echo "VRGL directory contents:"
          ls -la VRGL/ || echo "VRGL directory not found"
      
      - name: Run Script 1 - PBP Scrape and Cleanup
        run: |
          echo "Running Script 1 from $(pwd)"
          Rscript "VRGL/1. PBP Scrape and Cleanup - MBB.R"
        continue-on-error: false
      
      - name: Run Script 2 - In-Season Ratings
        run: |
          echo "Running Script 2 from $(pwd)"
          Rscript "VRGL/2. In-Season Ratings - All - MBB.R"
        continue-on-error: false
      
      - name: Run Script 3 - Create Revised Schedule
        run: |
          echo "Running Script 3 from $(pwd)"
          Rscript "VRGL/3. Create Revised Schedule - MBB.R"
        continue-on-error: false
      
      - name: Run Script 4 - Run Simulation
        run: |
          echo "Running Script 4 from $(pwd)"
          Rscript "VRGL/4. Run Simulation - MBB.R"
        continue-on-error: false
      
      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          echo "=== Git Status Before Add ==="
          git status
          
          echo "=== Adding all changes (including modified RDS files) ==="
          git add -A --force
          
          echo "=== Git Status After Add ==="
          git status
          
          echo "=== Files changed ==="
          git diff --staged --name-only
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update VRGL analysis results - $(date +'%Y-%m-%d %H:%M:%S')"
            echo "=== Pushing to remote ==="
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 'release'
      
      - name: Render Quarto site
        run: |
          echo "=== Rendering Quarto site from root ==="
          quarto render
        working-directory: ./
      
      - name: Check Quarto output location
        run: |
          echo "=== Checking for _site directories ==="
          find . -name "_site" -type d
          echo ""
          echo "=== Contents of _site ==="
          ls -la _site/ || echo "No _site in root"
          echo ""
          echo "=== Index file check ==="
          ls -la _site/index.html || echo "No index.html found"
          echo ""
          echo "=== Pages subdirectory check ==="
          ls -la _site/Pages/ || echo "No Pages subdirectory in _site"
      
      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          cname: false
      
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            VRGL/*.log
            VRGL/*.Rout
            VRGL/*.rds
          retention-days: 7
      
      - name: Send error notification email
        if: failure() && secrets.NOTIFICATION_EMAIL != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ VRGL Pipeline Failed - ${{ github.repository }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions
          body: |
            The VRGL Basketball Analysis Pipeline failed!
            
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_id }}
            Commit: ${{ github.sha }}
            
            View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Please check the logs for more information.
        continue-on-error: true
      
      - name: Send success notification email
        if: success() && secrets.NOTIFICATION_EMAIL != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ VRGL Pipeline Completed - ${{ github.repository }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions
          body: |
            The VRGL Basketball Analysis Pipeline completed successfully!
            
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_id }}
            Commit: ${{ github.sha }}
            Timestamp: $(date +'%Y-%m-%d %H:%M:%S')
            
            View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true